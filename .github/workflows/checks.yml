name: Check

on:
    push:
        branches: [main]
    pull_request:

jobs:
    lint:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-deps
            - run: npm run lint && echo 'No lint issues!' || (npm run lint-fix; git diff; echo 'Lint check failed, review diff above or run "npm run lint-fix"'; exit 1)

    build:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
                target: ['release-firefox', 'release-chrome']
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-deps
            - run: npm run ${{ matrix.target }}

    # The Node build scripts (scripts/build-tools/) are replacing the Makefile. Until
    # the Makefile is removed, check that both produce identical output.
    build-parity:
        strategy:
            fail-fast: false
            matrix:
                browser: [chrome, firefox, embedded, chromium-embedded]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/install-deps
            - name: Build with make
              run: |
                  make copy build browser=${{ matrix.browser }} type=release
                  mv build/${{ matrix.browser }}/release /tmp/make-release
            - name: Build with node
              run: node scripts/build-tools/build.mjs --browser ${{ matrix.browser }} --type release
            - name: Compare
              run: diff -r /tmp/make-release build/${{ matrix.browser }}/release

    # Windows has no make; the Node build scripts are the only way to build there.
    build-windows:
        strategy:
            fail-fast: false
            matrix:
                browser: [chrome, firefox, chromium-embedded]
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/install-deps
            - run: node scripts/build-tools/build.mjs --browser ${{ matrix.browser }} --type release
            - run: node scripts/build-tools/build.mjs --browser ${{ matrix.browser }} --type dev

    unit-tests:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-deps
              with:
                  browsers: chromium
            - run: npm test

    playwright-tests:
        timeout-minutes: 14
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                test: [playwright, playwright-firefox]
                shard: [1/4, 2/4, 3/4, 4/4]
                include:
                    # chromium-embedded runs a small test subset, so a single shard is enough
                    - test: playwright-chromium-embedded
                      shard: 1/1
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-deps
              with:
                  browsers: ${{ matrix.test == 'playwright-firefox' && 'firefox' || 'chromium' }}
            - name: Run tests
              run: xvfb-run --auto-servernum -- npm run ${{ matrix.test }} -- --shard ${{ matrix.shard }}
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: ${{ matrix.test }}-report-${{ strategy.job-index }}
                  path: playwright-report/
                  retention-days: 1

