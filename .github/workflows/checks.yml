name: Check

on:
    push:
        branches: [main]
    pull_request:

jobs:
    lint:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            # Lint only needs the npm packages, not Playwright browsers or the
            # privacy-test-pages install that `install-ci` also performs.
            - run: npm ci --ignore-scripts
            - run: npm run lint && echo 'No lint issues!' || (npm run lint-fix; git diff; echo 'Lint check failed, review diff above or run "npm run lint-fix"'; exit 1)

    build:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
                target: ['release-firefox', 'release-chrome']
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            - run: npm run install-ci
            - run: npm run ${{ matrix.target }}

    unit-tests:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            - run: npm run install-ci
            - run: npm test

    playwright-tests:
        timeout-minutes: 14
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                test: [playwright, playwright-firefox]
                shard: [1/4, 2/4, 3/4, 4/4]
                include:
                    # chromium-embedded runs a small test subset, so a single shard is enough
                    - test: playwright-chromium-embedded
                      shard: 1/1
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            - run: npm run install-ci
            - name: Run tests
              run: xvfb-run --auto-servernum -- npm run ${{ matrix.test }} -- --shard ${{ matrix.shard }}
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: ${{ matrix.test }}-report-${{ strategy.job-index }}
                  path: playwright-report/
                  retention-days: 1

