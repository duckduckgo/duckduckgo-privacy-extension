name: ddg2dnr

on: [pull_request]

# A new push to a PR cancels the older runs for that PR. Other events get their own group, so they always run to the end.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: '${{ matrix.os }}'
        strategy:
            matrix:
                os: [ubuntu-22.04] # FIXME - macos-latest runner keeps failing
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-deps
            - run: npm run lint --workspace=packages/ddg2dnr
    test:
        runs-on: '${{ matrix.os }}'
        strategy:
            matrix:
                os: [ubuntu-22.04]
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-deps
              with:
                  browsers: chromium firefox
            - run: npm test --workspace=packages/ddg2dnr
