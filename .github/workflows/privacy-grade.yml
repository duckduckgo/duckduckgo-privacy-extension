name: Privacy Grade

on:
    push:
        branches:
            - develop
    pull_request:

# A new push to a PR cancels the older runs for that PR. Other events get their own group, so they always run to the end.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-deps
            - name: Lint
              run: npm run lint --workspace=packages/privacy-grade

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-deps
              with:
                  tests: true
            - name: Test
              run: npm test --workspace=packages/privacy-grade
