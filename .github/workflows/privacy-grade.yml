name: Privacy Grade

on:
    push:
        branches:
            - develop
    pull_request:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-deps
            - name: Lint
              run: npm run lint --workspace=packages/privacy-grade

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-deps
              with:
                  browsers: chromium
            - name: Test
              run: npm test --workspace=packages/privacy-grade
