name: Release Chromium Embedded Extension

# Publishes the built chromium-embedded target to the orphan branch
# `build/chromium-embedded/release`, which the DDG-Chromium fork consumes as
# a submodule. See that branch's README, and the tech design "DDG-Chromium
# component extension bundling".
#
# Unlike release-embedded.yml, nothing is pushed to another repository: the
# fork pulls, rather than being pushed to, so a bump lands there when someone
# chooses to move the submodule pin.

on:
    push:
        branches:
            - 'main'
        paths:
            - 'browsers/chromium-embedded/manifest.json'
    # For the first run, for rebuilding a version without bumping it, and for
    # test builds of a feature branch (channel: test, run with --ref <branch>).
    workflow_dispatch:
        inputs:
            channel:
                description: 'release: the branch the browser pins (main only). test: build/chromium-embedded/test, any ref.'
                type: choice
                options:
                    - release
                    - test
                default: release

# Runs queue rather than race to push to ARTIFACTS_BRANCH.
concurrency:
    group: release-chromium-embedded
    cancel-in-progress: false
    queue: max

env:
    # The release branch is named after the directory it carries. Git reads a
    # bare build/chromium-embedded/release as ambiguous wherever that directory
    # exists, so every ref below is spelled refs/heads/. A push has no inputs,
    # so it always publishes to release.
    ARTIFACTS_BRANCH: build/chromium-embedded/${{ inputs.channel || 'release' }}
    BUILD_PATH: build/chromium-embedded/release

jobs:
    release_chromium_embedded:
        runs-on: ubuntu-latest
        permissions:
            # Committing to ARTIFACTS_BRANCH in this repository.
            contents: write
        steps:
            # The browser's scheduled roll picks up whatever lands on release,
            # so only main may publish there. Feature branches use test.
            - name: Refuse release builds off main
              if: env.ARTIFACTS_BRANCH == 'build/chromium-embedded/release' && github.ref != 'refs/heads/main'
              run: |
                  echo "::error::Only main publishes to the release branch; rerun with channel: test."
                  exit 1

            - uses: actions/checkout@v6

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Read embedded version
              id: version
              run: |
                  VERSION=$(jq -r .version browsers/chromium-embedded/manifest.json)
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

            - name: Install dependencies
              run: npm run install-ci

            - name: Build chromium-embedded extension
              run: npm run release-chromium-embedded

            # The test branch is created on its first use: an empty root commit,
            # so it shares no history with main, the same as release.
            - name: Seed the artifacts branch
              run: |
                  if git ls-remote --exit-code origin "refs/heads/$ARTIFACTS_BRANCH" >/dev/null; then
                      exit 0
                  fi
                  git config user.name "Dax the Deployer"
                  git config user.email "dax@duckduckgo.com"
                  EMPTY_TREE=$(git hash-object -t tree /dev/null)
                  SEED=$(git commit-tree "$EMPTY_TREE" -m "Seed $ARTIFACTS_BRANCH")
                  git push origin "$SEED:refs/heads/$ARTIFACTS_BRANCH"

            # Checked out beside the source tree so the build output above is
            # untouched by the checkout.
            - name: Check out the artifacts branch
              uses: actions/checkout@v6
              with:
                  ref: refs/heads/${{ env.ARTIFACTS_BRANCH }}
                  path: artifacts

            - name: Stage the build
              run: |
                  # Replaced wholesale rather than copied over: a file dropped
                  # upstream has to disappear here too, or the fork keeps
                  # bundling it forever.
                  rm -rf "artifacts/$BUILD_PATH"
                  mkdir -p "artifacts/$BUILD_PATH"
                  cp -R "$BUILD_PATH/." "artifacts/$BUILD_PATH/"
                  # The fork consumes this branch as a third_party submodule,
                  # and a third_party entry needs a License File to point at.
                  # The build output carries none, so it comes from source.
                  cp LICENSE.md artifacts/LICENSE.md

            - name: Commit and push
              working-directory: artifacts
              env:
                  VERSION: ${{ steps.version.outputs.VERSION }}
              run: |
                  git config user.name "Dax the Deployer"
                  git config user.email "dax@duckduckgo.com"
                  git add --all "$BUILD_PATH" LICENSE.md
                  if git diff --cached --quiet; then
                      echo "Build output is unchanged; nothing to commit."
                      exit 0
                  fi
                  # The source sha is the only thing tying these bytes back to
                  # the code that produced them - the branches share no history.
                  git commit -m "chromium-embedded $VERSION

                  Source commit: ${{ github.sha }}
                  Source ref: ${{ github.ref_name }}
                  Built by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  # Appended, never forced: the fork pins commits on this
                  # branch, and rewriting it would strand those pins.
                  git push origin "HEAD:refs/heads/$ARTIFACTS_BRANCH"
