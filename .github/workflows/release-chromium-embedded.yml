name: Release Chromium Embedded Extension

# Publishes the chromium-embedded build to an orphan branch that the
# DDG-Chromium fork consumes as a submodule and rolls from: main to
# build/chromium-embedded/release, test builds of any ref to
# build/chromium-embedded/test.

on:
    push:
        branches:
            - 'main'
        paths:
            - 'browsers/chromium-embedded/manifest.json'
    # For rebuilding a version without bumping it, and for test builds.
    workflow_dispatch:
        inputs:
            channel:
                description: 'release (main only) or test (any ref)'
                type: choice
                options:
                    - release
                    - test
                default: release

# Runs queue rather than race to push to ARTIFACTS_BRANCH.
concurrency:
    group: release-chromium-embedded
    cancel-in-progress: false
    queue: max

env:
    # Git reads a bare build/chromium-embedded/release as ambiguous wherever
    # that directory exists, so every ref below is spelled refs/heads/.
    ARTIFACTS_BRANCH: build/chromium-embedded/${{ inputs.channel || 'release' }}
    BUILD_PATH: build/chromium-embedded/release

jobs:
    release_chromium_embedded:
        runs-on: ubuntu-latest
        permissions:
            # Committing to ARTIFACTS_BRANCH in this repository.
            contents: write
        steps:
            # The fork rolls whatever lands on the release branch.
            - name: Check the release channel is built from main
              if: env.ARTIFACTS_BRANCH == 'build/chromium-embedded/release' && github.ref != 'refs/heads/main'
              run: |
                  echo "::error::Only main publishes to the release branch. Use the test channel."
                  exit 1

            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Read embedded version
              id: version
              run: |
                  VERSION=$(jq -r .version browsers/chromium-embedded/manifest.json)
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

            - name: Install dependencies
              run: npm run install-ci

            - name: Build chromium-embedded extension
              run: npm run release-chromium-embedded

            # The first test build starts the test branch from the release one.
            - name: Create the test branch
              if: env.ARTIFACTS_BRANCH == 'build/chromium-embedded/test'
              run: |
                  if ! git ls-remote --exit-code origin "refs/heads/$ARTIFACTS_BRANCH" > /dev/null; then
                      git fetch --depth 1 origin refs/heads/build/chromium-embedded/release
                      git push origin "FETCH_HEAD:refs/heads/$ARTIFACTS_BRANCH"
                  fi

            # Checked out beside the source tree so the build output above is
            # untouched by the checkout.
            - name: Check out the artifacts branch
              uses: actions/checkout@v7
              with:
                  ref: refs/heads/${{ env.ARTIFACTS_BRANCH }}
                  path: artifacts

            - name: Stage the build
              run: |
                  # Replaced wholesale rather than copied over: a file dropped
                  # upstream has to disappear here too, or the fork keeps
                  # bundling it forever.
                  rm -rf "artifacts/$BUILD_PATH"
                  mkdir -p "artifacts/$BUILD_PATH"
                  cp -R "$BUILD_PATH/." "artifacts/$BUILD_PATH/"
                  # The fork consumes this branch as a third_party submodule,
                  # and a third_party entry needs a License File to point at.
                  # The build output carries none, so it comes from source.
                  cp LICENSE.md artifacts/LICENSE.md

            - name: Commit and push
              working-directory: artifacts
              env:
                  VERSION: ${{ steps.version.outputs.VERSION }}
                  SOURCE_REF: ${{ github.ref_name }}
              run: |
                  git config user.name "Dax the Deployer"
                  git config user.email "dax@duckduckgo.com"
                  git add --all "$BUILD_PATH" LICENSE.md
                  if git diff --cached --quiet; then
                      echo "Build output is unchanged; nothing to commit."
                      exit 0
                  fi
                  # The source sha is the only thing tying these bytes back to
                  # the code that produced them - the branches share no history.
                  git commit -m "chromium-embedded $VERSION

                  Source commit: ${{ github.sha }}
                  Source ref: $SOURCE_REF
                  Built by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  # Appended, never forced: the fork pins commits on this
                  # branch, and rewriting it would strand those pins.
                  git push origin "HEAD:refs/heads/$ARTIFACTS_BRANCH"
