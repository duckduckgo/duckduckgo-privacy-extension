version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      cooldown:
          # Matches min-release-age=7 in .npmrc
          default-days: 7
      open-pull-requests-limit: 10
      target-branch: 'main'
      labels:
          - 'dependencies'
      ignore:
          - dependency-name: '@duckduckgo/autoconsent'
      groups:
          # A dependency joins the FIRST group it matches, so catch-alls go last.
          security:
              applies-to: security-updates
              patterns:
                  - '*'
          content-scope-scripts:
              patterns:
                  - '@duckduckgo/content-scope-scripts'
                  - '@duckduckgo/privacy-configuration'
          ddg-test-data:
              patterns:
                  - '@duckduckgo/privacy-reference-tests'
                  - 'privacy-test-pages'
                  - '@duckduckgo/pixel-schema'
          types:
              patterns:
                  - '@types/*'
          test:
              patterns:
                  - '@playwright/*'
                  - 'karma*'
                  - 'jasmine*'
                  - 'mocha'
                  - 'jsdom'
                  - 'fake-indexeddb'
                  - 'timekeeper'
                  - 'firefox-webext-playwright-harness'
          build:
              patterns:
                  - '@duckduckgo/eslint-config'
                  - 'eslint*'
                  - 'globals'
                  - 'prettier'
                  - 'typescript'
                  - 'sass'
                  - 'esbuild'
                  - 'archiver'
          runtime:
              dependency-type: 'production'
              update-types:
                  - 'minor'
                  - 'patch'
              exclude-patterns:
                  - '@duckduckgo/*'
          dev-misc:
              dependency-type: 'development'
              update-types:
                  - 'minor'
                  - 'patch'
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'
      cooldown:
          default-days: 7
      target-branch: 'main'
      labels:
          - 'dependencies'
      groups:
          actions:
              patterns:
                  - '*'
